# Builds the ICAOSA Android app on Expo's servers.
# Run it from GitHub: Actions → "Build Android app" → Run workflow.
# Setup (one time): docs/BUILD-APK.md
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to build
        type: choice
        default: APK to install and share
        options:
          - APK to install and share
          - Play Store bundle (.aab)

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Setting missing::Add your Expo access token as a repository secret named EXPO_TOKEN (docs/BUILD-APK.md, part 2)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.5.0
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check the Expo account
        env:
          NO_COLOR: '1'
        run: |
          if who="$(eas whoami 2>&1)"; then
            echo "::notice title=Expo account::Signed in to Expo as $(echo "$who" | head -1)"
          else
            echo "::error title=Expo did not accept the EXPO_TOKEN::$(echo "$who" | tail -3 | tr '\n' ' ') Create a new token on expo.dev (Account settings, Access tokens) and paste it again as the EXPO_TOKEN secret."
            exit 1
          fi

      - name: Install the app's packages
        run: npm ci

      - name: Apply ICAOSA settings
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REVIEW_EMAIL: ${{ vars.REVIEW_EMAIL }}
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: node scripts/ci/apply-build-settings.mjs

      - name: Build on Expo (takes 10 to 40 minutes)
        env:
          # Upload the folder as it is now, including the settings applied above.
          EAS_NO_VCS: '1'
          PROFILE: ${{ inputs.kind == 'Play Store bundle (.aab)' && 'production' || 'preview' }}
          NO_COLOR: '1'
        run: |
          set +e
          eas build --platform android --profile "$PROFILE" --non-interactive --wait --json > build.json 2> eas.log
          code=$?
          cat eas.log
          if [ $code -ne 0 ]; then
            # Show Expo's own error message at the top of the run page.
            msg="$(sed -E 's/\x1b\[[0-9;]*m//g' eas.log | grep -v -E '^\s*$|is now available|To upgrade|npm install -g|Proceeding with outdated' | tail -12 | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Expo build problem::$msg"
          fi
          exit $code

      - name: Show the download link
        if: always()
        run: |
          if [ -s build.json ]; then node scripts/ci/report-build.mjs build.json; else echo "::error::The build did not start. Read the step above for the reason."; exit 1; fi

      - name: Download the file from Expo
        id: download
        if: success()
        run: |
          url="$(cat artifact-url.txt)"
          name="ICAOSA-$(date +%Y%m%d-%H%M).${url##*.}"
          curl -fsSL "$url" -o "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the file to this run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.file }}
          path: ${{ steps.download.outputs.file }}
          retention-days: 30
