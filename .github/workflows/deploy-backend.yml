# Puts the ICAOSA server functions online in Supabase and saves their secrets.
# Run it from GitHub: Actions → "Deploy server functions" → Run workflow.
# Setup (one time): docs/BUILD-APK.md
name: Deploy server functions

on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Check settings
        id: check
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          fail=0
          need() { echo "::error title=Setting missing::$1"; fail=1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || need "Add a Supabase access token as the repository secret SUPABASE_ACCESS_TOKEN (supabase.com → your account → Access Tokens)."
          [ -n "$SUPABASE_URL" ] || SUPABASE_URL="$(node -p "require('./eas.json').build.base.env.EXPO_PUBLIC_SUPABASE_URL || ''")"
          ref="$(echo "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#p')"
          [ -n "$ref" ] || need "Add the repository variable SUPABASE_URL (https://xxxx.supabase.co, from Supabase → Project Settings → API Keys)."
          [ -n "$PAYSTACK_SECRET_KEY" ] || need "Add your Paystack secret key (sk_test_... or sk_live_...) as the repository secret PAYSTACK_SECRET_KEY."
          case "$PAYSTACK_SECRET_KEY" in sk_test_*|sk_live_*|"") ;; *) need "PAYSTACK_SECRET_KEY should start with sk_test_ or sk_live_. Use the SECRET key, not the public key.";; esac
          [ -n "$CRON_SECRET" ] || need "Add the repository secret CRON_SECRET: any long random password (it protects the daily reminders)."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          case "$PAYSTACK_SECRET_KEY" in sk_live_*) echo "mode=LIVE" >> "$GITHUB_OUTPUT";; *) echo "mode=TEST" >> "$GITHUB_OUTPUT";; esac
          exit $fail

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Save the server secrets
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
        run: |
          args=("PAYSTACK_SECRET_KEY=$PAYSTACK_SECRET_KEY" "CRON_SECRET=$CRON_SECRET")
          [ -n "$EXPO_ACCESS_TOKEN" ] && args+=("EXPO_ACCESS_TOKEN=$EXPO_ACCESS_TOKEN")
          supabase secrets set --remote="${{ steps.check.outputs.ref }}" --yes "${args[@]}"

      - name: Deploy the functions
        run: supabase functions deploy --remote="${{ steps.check.outputs.ref }}" --use-api --yes

      - name: Summary
        run: |
          ref="${{ steps.check.outputs.ref }}"
          {
            echo "## Server functions are online"
            echo
            echo "Paystack mode: **${{ steps.check.outputs.mode }}**"
            echo
            echo "Paste this into Paystack → Settings → API Keys & Webhooks → **${{ steps.check.outputs.mode == 'LIVE' && 'Live' || 'Test' }} Webhook URL**:"
            echo
            echo "\`https://$ref.supabase.co/functions/v1/paystack-webhook\`"
          } >> "$GITHUB_STEP_SUMMARY"
